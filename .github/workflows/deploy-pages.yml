name: Deploy Godot game to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and verify Godot 3.6.2
        shell: bash
        run: |
          set -euo pipefail
          release_url="https://github.com/godotengine/godot/releases/download/3.6.2-stable"
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/templates/3.6.2.stable"
          curl -fL --retry 3 "$release_url/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot/SHA512-SUMS.txt"
          curl -fL --retry 3 "$release_url/Godot_v3.6.2-stable_linux_headless.64.zip" -o "$RUNNER_TEMP/godot/Godot_v3.6.2-stable_linux_headless.64.zip"
          curl -fL --retry 3 "$release_url/Godot_v3.6.2-stable_export_templates.tpz" -o "$RUNNER_TEMP/godot/Godot_v3.6.2-stable_export_templates.tpz"
          cd "$RUNNER_TEMP/godot"
          awk '$2 == "Godot_v3.6.2-stable_linux_headless.64.zip" || $2 == "Godot_v3.6.2-stable_export_templates.tpz"' SHA512-SUMS.txt > selected.sha512
          test "$(wc -l < selected.sha512)" -eq 2
          sha512sum --check selected.sha512
          unzip -q Godot_v3.6.2-stable_linux_headless.64.zip
          chmod +x Godot_v3.6.2-stable_linux_headless.64
          unzip -q -j Godot_v3.6.2-stable_export_templates.tpz \
            'templates/webassembly_debug.zip' \
            'templates/webassembly_release.zip' \
            -d "$HOME/.local/share/godot/templates/3.6.2.stable"
          ./Godot_v3.6.2-stable_linux_headless.64 --version | grep -F '3.6.2.stable'

      - name: Export HTML5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          "$RUNNER_TEMP/godot/Godot_v3.6.2-stable_linux_headless.64" \
            --path "PEASHOOTER RPG" \
            --export "Web" \
            "$GITHUB_WORKSPACE/build/web/index.html"
          test -s build/web/index.html
          test -s build/web/index.js
          test -s build/web/index.wasm
          test -s build/web/index.pck

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
